name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: C++ backend (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Configure
        run: |
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            cmake -S backend -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMF_SANITIZE=ON -DMF_WERROR=ON
          else
            cmake -S backend -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMF_WERROR=ON
          fi
      - name: Build
        run: cmake --build build
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/measureflow_tests
      - name: Upload backend binary
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: build/measureflow_backend

  backend-coverage:
    name: C++ coverage (gate 85 %)
    needs: [frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            simulator/requirements.txt
            tests/requirements.txt
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ gcovr
      - run: pip install -r simulator/requirements.txt -r tests/requirements.txt
      - run: cmake -S backend -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMF_COVERAGE=ON
      - run: cmake --build build-cov
      - run: ./build-cov/measureflow_tests
      - name: Exercise backend through its API
        env:
          MF_BACKEND: ${{ github.workspace }}/build-cov/measureflow_backend
        run: python -m pytest -q tests/integration tests/api
      - name: Coverage of backend/src
        run: |
          gcovr -r backend --filter 'backend/src/' --exclude 'backend/src/main.cpp' \
                --object-directory build-cov --print-summary --fail-under-line 85 \
                --gcov-ignore-parse-errors=negative_hits.warn \
                --xml coverage.xml --html-details coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage*.html

  simulator:
    name: Python simulator (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt
      - name: pytest with coverage gate
        run: python -m pytest -q simulator/tests --cov=simulator/mfsim --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (typecheck, component tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  integration:
    name: Integration, API and regression tests
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            simulator/requirements.txt
            tests/requirements.txt
      - run: pip install -r simulator/requirements.txt -r tests/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/build
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: chmod +x backend/build/measureflow_backend
      - run: python -m pytest -q tests/integration tests/api

  experiments:
    name: Experiments E01-E10 (fixed seed)
    needs: [backend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            simulator/requirements.txt
            tests/requirements.txt
      - run: pip install -r simulator/requirements.txt -r tests/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/build
      - run: chmod +x backend/build/measureflow_backend
      - run: python experiments/run_experiments.py --root . --backend backend/build/measureflow_backend --out results/experiments-ci
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/experiments-ci

  e2e:
    name: Playwright E2E
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: pip install -r simulator/requirements.txt -r tests/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/build
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: chmod +x backend/build/measureflow_backend
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
